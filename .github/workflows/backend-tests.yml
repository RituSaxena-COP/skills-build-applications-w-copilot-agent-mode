name: CI - Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r octofit-tracker/backend/requirements.txt

      - name: Wait for MongoDB
        run: |
          for i in {1..10}; do
            python - <<PY || true
import time
from pymongo import MongoClient
try:
    MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=2000).admin.command('ping')
    print('Mongo ready')
    raise SystemExit(0)
except Exception as e:
    print('Mongo not ready yet')
    time.sleep(2)
    raise SystemExit(1)
PY
            if [ $? -eq 0 ]; then break; fi
            sleep 1
          done

      - name: Create default Site (workaround for djongo)
        run: python octofit-tracker/backend/scripts/create_default_site.py

      - name: Run migrations
        run: python octofit-tracker/backend/manage.py migrate --noinput

      - name: Run tests
        run: python octofit-tracker/backend/manage.py test --verbosity=2
